name: Keep Render free service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Configure the RENDER_BACKEND_URL repository secret first."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "${BACKEND_URL%/}/health"
